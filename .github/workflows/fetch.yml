name: fetch-cv
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fetch:
    if: ${{ !contains(github.event.head_commit.message, 'add CV') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L -o Kamel_Nassif_Resume.pdf "https://drive.usercontent.google.com/download?id=1XxKbvbLegP3nWrPqQdEG10gMW0uNUIbA&export=download&confirm=t"
          file Kamel_Nassif_Resume.pdf
          head -c 5 Kamel_Nassif_Resume.pdf | grep -q '%PDF' 
          git config user.name kemo24n
          git config user.email kemo24n@users.noreply.github.com
          git add Kamel_Nassif_Resume.pdf
          git commit -m "add CV" && git push
